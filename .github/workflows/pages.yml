name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project scripts/windows-setup-checks/WindowsHostChecks.csproj -c Release
      - run: dotnet publish native/windows-host/ObsidianInWord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app
      - shell: pwsh
        run: |
          Copy-Item native/windows-host/README.md publish/app/README.md
          Compress-Archive -Path publish/app/ObsidianInWord.exe,publish/app/README.md -DestinationPath obsidian-in-word-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: obsidian-in-word-windows.zip
  deploy:
    needs: windows-app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist/downloads
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
