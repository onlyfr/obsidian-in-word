<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>obsidian-in-word</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./taskpane.css" />
  </head>
  <body>
    <header>
      <button id="load">선택 영역 → 마크다운</button>
      <button id="apply">Word에 적용</button>
      <button id="open-settings" type="button" aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">설정</button>
    </header>
    <section id="body-controls" class="body-controls" aria-label="본문 편집 준비" hidden>
      <div class="body-control-buttons"><strong>본문 편집 준비</strong><button type="button" data-body-check>상태 확인</button><button type="button" data-body-start>시작</button><button type="button" data-body-stop disabled>중지</button></div>
      <p role="status" data-body-status>본문 편집 준비가 꺼져 있습니다.</p>
    </section>
    <div id="editor"></div>
    <p id="status" role="status"></p>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-header">
        <h2 id="settings-title">설정</h2>
        <button id="close-settings" type="button">닫기</button>
      </div>
      <div class="settings-tabs" role="tablist" aria-label="설정 분류">
        <button id="options-tab" type="button" role="tab" aria-controls="options-panel" aria-selected="true">옵션</button>
        <button id="plugins-tab" type="button" role="tab" aria-controls="plugins" aria-selected="false" tabindex="-1">커뮤니티 플러그인</button>
      </div>
      <div class="settings-content">
        <section id="options-panel" role="tabpanel" aria-labelledby="options-tab">
          <fieldset class="option-group">
            <legend>수식</legend>
            <label class="option-row" for="math-output">수식 출력
              <select id="math-output" aria-describedby="math-output-help">
                <option value="hybrid">Word 수식 우선 (기본)</option>
                <option value="images">모두 그림 (Obsidian 스타일 수식 글꼴)</option>
              </select>
            </label>
            <p id="math-output-help" class="option-help">모든 수식을 Obsidian 스타일의 MathJax TeX 글꼴로 통일하려면 ‘모두 그림’을 선택하세요. 그림도 불러오면 LaTeX로 편집할 수 있습니다. 원본 보존 블록 안의 수식은 제외됩니다.</p>
          </fieldset>
          <fieldset class="option-group">
            <legend>작업창 에디터</legend>
            <p class="option-help">아래 옵션은 작업창의 마크다운 에디터에 적용됩니다.</p>
            <label class="option-check"><input id="editor-line-numbers" type="checkbox" checked /> 줄 번호 표시</label>
            <label class="option-check"><input id="editor-wrap" type="checkbox" checked /> 긴 줄 자동 줄바꿈</label>
            <label class="option-row" for="editor-font-size">글자 크기
              <select id="editor-font-size">
                <option value="12">12px</option><option value="14" selected>14px (기본)</option>
                <option value="16">16px</option><option value="18">18px</option><option value="20">20px</option>
              </select>
            </label>
          </fieldset>
        </section>
        <section id="plugins" role="tabpanel" aria-labelledby="plugins-tab" hidden>
      <p class="warn">플러그인은 불러온 JS 코드를 이 작업창에서 그대로 실행합니다. 신뢰하는 것만 사용하세요. 작업창 에디터 안에서만 동작합니다.</p>
      <div id="plugin-main">
        <p id="plugin-loading" role="status">플러그인을 불러오는 중…</p>
        <label for="plugin-files">manifest.json과 main.js를 함께 선택하세요. styles.css는 선택입니다.</label>
        <input id="plugin-files" type="file" multiple accept=".js,.json,.css" disabled />
        <div id="plugin-list"></div>
        <div class="cmd-row">
          <select id="plugin-commands" aria-label="플러그인 명령" disabled></select>
          <button id="plugin-run" disabled>실행</button>
        </div>
      </div>
      <div id="plugin-settings" hidden></div>
        </section>
      </div>
    </dialog>
    <script type="module" src="./taskpane.ts"></script>
  </body>
</html>
