<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>obsidian-in-word</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="./taskpane.css" />
  </head>
  <body>
    <header>
      <button id="load">선택 영역 → 마크다운</button>
      <button id="apply">Word에 적용</button>
    </header>
    <div class="preferences">
      <label for="math-output">수식 출력</label>
      <select id="math-output">
        <option value="hybrid">Word 수식 우선 (기본)</option>
        <option value="images">모두 그림</option>
      </select>
      <small>그림도 불러오면 LaTeX로 편집할 수 있습니다. 원본 보존 블록 안의 수식은 제외됩니다.</small>
    </div>
    <div id="editor"></div>
    <p id="status" role="status"></p>
    <details id="plugins">
      <summary>플러그인 (Obsidian 커뮤니티)</summary>
      <p class="warn">플러그인은 불러온 JS 코드를 이 작업창에서 그대로 실행합니다. 신뢰하는 것만 사용하세요. 작업창 에디터 안에서만 동작합니다.</p>
      <div id="plugin-main">
        <input id="plugin-files" type="file" multiple accept=".js,.json,.css" />
        <div id="plugin-list"></div>
        <div class="cmd-row">
          <select id="plugin-commands"></select>
          <button id="plugin-run">실행</button>
        </div>
      </div>
      <div id="plugin-settings" hidden></div>
    </details>
    <script type="module" src="./taskpane.ts"></script>
  </body>
</html>
